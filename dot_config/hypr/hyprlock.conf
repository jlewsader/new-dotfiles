$wall = /usr/share/backgrounds/gnome/amber-d.jxl
$USER_IMAGE = ~/.face
$font = JetBrainsMono Nerd Font

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Profie-Photo
image {
    monitor =
    path = $USER_IMAGE
    border_size = 2
    border_color = rgba(34, 84, 150, 0.71)
    size = 300
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 15%
    halign = center
    valign = center
}

# NAME
label {
    monitor =
    text = $DESC
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_family = $font
    font_size = 70
    position = 0, 0
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%l:%M %p")</span>"
    color = rgba(216, 222, 233, 0.80)
    font_size = 60
    font_family = $font
    position = 0, -80
    halign = center
    valign = top
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .80)
    font_size = 30
    font_family = $font
    position = 0, -20
    halign = center
    valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 520, 95
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    font_family = SF Pro Display Bold
    check_color = rgba(0, 255, 0, 0.6)
    fail_color = rgba(255, 0, 0, 0.6)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff99">   Password</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}
