# --------------------------------
# Set Default shell to zsh
# --------------------------------
#set-option -g default-shell /usr/bin/zsh
#set-option -g default-command /usr/bin/zsh

# ------------------------------
# General
# ------------------------------

unbind C-b
set-option -g prefix C-a
set -g base-index 1 
set -g escape-time 0 
set -g detach-on-destroy off 
setw -g mode-keys vi # Use vi style keys in copy mode
set -g mouse off
set -g renumber-windows on
set -g history-limit 10000
set -s default-terminal 'xterm-256color'
# set -g default-terminal "tmux-256color"
# Enable 24-bit RGB / True Color support
# set -as terminal-features ',xterm-256color:RGB'
# set -ga terminal-overrides ',xterm-256color:Tc'
set -g set-clipboard on # Use system clipboard when possible
setw -g automatic-rename on
set -g repeat-time 1000  # increase "prefix-free" window

set -g @continuum-restore 'off'

# OSC52 copy to local clipboard (works over SSH)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
"tmux save-buffer - | base64 | tr -d '\n' | sed 's/.*/\x1b]52;c;&\x07/'"

# Prefix + / to search
bind-key / copy-mode \; send-key ?

# Reload config 
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

##### Safe Ctrl-D (don’t kill last tmux session) #####
bind -n C-d if-shell -F "#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}" \
  "detach-client" \
  "send-keys C-d"

# ------------------------------
# Splits (vim-style)
# ------------------------------

unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# ------------------------------
# Pane navigation (vim keys)
# ------------------------------
# Neovim <-> tmux navigation
# ------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim)$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Resize panes
bind < resize-pane -L 10
bind + resize-pane -D 10
bind - resize-pane -U 10
bind > resize-pane -R 10

# ------------------------------
# Windows
# ------------------------------
bind A choose-session
bind m choose-tree
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# Swap Windows
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Session Management
 unbind S
 bind S command-prompt 'rename-session %%'
 bind N new-session
# # Create new session from current window
 bind B command-prompt -p "New session name:" "new-session -d -s '%%'; move-window -t '%%:'; switch-client -t '%%'"

# -----------------------------
# Popups
# -----------------------------

bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind C-f display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"
bind C-c display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-n display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# ------------------------------
# Status bar
# ------------------------------
set -g @bg "#1e1e2e" 

set-option -g status "on"

set -g status-position top
set -g status-interval 5

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 30

# Default statusbar color
set-option -g status-style "bg=default,fg=white" 

# Default window title colors
set-window-option -g window-status-style "bg=#a6e3a1,fg=#{@bg}"

# Default window with an activity alert
set-window-option -g window-status-activity-style "bg=#{@bg},fg=#f9e2af"

# Active window title colors
set-window-option -g window-status-current-style "bg=#f38ba8,fg=#{@bg}"

# Set pan border lines style
set -g pane-border-lines heavy

# Set active pane border color
set-option -g pane-active-border-style "fg=#94e2d5"

# Set inactive pane border color
set-option -g pane-border-style "fg=#313244"

# Message info
set-option -g message-style "bg=#74c7ec,fg=black"

# Writing commands inactive
set-option -g message-command-style "bg=white,fg=black" 

# Pane number display
set-option -gF display-panes-active-colour "white"
set-option -gF display-panes-colour "#{@bg}"

# Clock
set-window-option -gF clock-mode-colour "#89dceb"

# Bell
set-window-option -g window-status-bell-style "bg=#f38ba8,fg=#{@bg}"

set-option -g status-left "\
#[fg=#{@bg}, bg=#cba6f7, bold]#{?client_prefix,#[bg=#fab387]#[fg=#{@bg}],} #S \
#[fg=#cba6f7, bg=#{@bg}]#{?client_prefix,#[fg=#fab387],}#{?window_zoomed_flag, 🔍,}"

set-option -g status-right "\
#[fg=#94e2d5, bg=#{@bg}]\
#[fg=#{@bg}, bg=#94e2d5] #h \
#[fg=#{@bg}, bg=#94e2d5]\
#[fg=#f5c2e7, bg=#{@bg}]\
#[fg=#{@bg}, bg=#f5c2e7]%l:%M %P "

set-window-option -g window-status-current-format "\
#[fg=#{@bg}, bg=#a6e3a1]\
#[fg=#{@bg}, bg=#a6e3a1] #I \
#[fg=#{@bg}, bg=#a6e3a1, bold] #W \
#[fg=#a6e3a1, bg=#{@bg}]"

set-window-option -g window-status-format "\
#[fg=#{@bg},bg=#cba6f7,noitalics]\
#[fg=#{@bg},bg=#cba6f7] #I \
#[fg=#{@bg}, bg=#cba6f7] #W \
#[fg=#cba6f7, bg=#{@bg}]"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
