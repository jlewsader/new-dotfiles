# --------------------------------
# Set Default shell to zsh
# --------------------------------
#set-option -g default-shell /usr/bin/zsh
#set-option -g default-command /usr/bin/zsh

# ------------------------------
# General
# ------------------------------

unbind C-b
set-option -g prefix C-a
set -g base-index 1 
set -g escape-time 0 
set -g detach-on-destroy off 
setw -g mode-keys vi # Use vi style keys in copy mode
set -g mouse off
set -g renumber-windows on
set -g history-limit 10000
set -g default-terminal 'tmux-256color'
# Enable 24-bit RGB / True Color support
set -sa terminal-features ',xterm-256color:RGB'
set -ga terminal-overrides ',xterm-256color:Tc'
set -g set-clipboard on # Use system clipboard when possible
setw -g automatic-rename on
set -g repeat-time 1000  # increase "prefix-free" window

set -g @continuum-restore 'off'

# OSC52 copy to local clipboard (works over SSH)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
"tmux save-buffer - | base64 | tr -d '\n' | sed 's/.*/\x1b]52;c;&\x07/'"

# Prefix + / to search
bind-key / copy-mode \; send-key ?

# Reload config 
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

##### Safe Ctrl-D (don’t kill last tmux session) #####
bind -n C-d if-shell -F "#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}" \
  "detach-client" \
  "send-keys C-d"

# ------------------------------
# Splits (vim-style)
# ------------------------------

unbind '"'
unbind %
unbind "-"
bind "\\" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"

# ------------------------------
# Pane navigation (vim keys)
# ------------------------------
# Neovim <-> tmux navigation
# ------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim)$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Resize panes using Shift + Vim keys
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# ------------------------------
# Windows
# ------------------------------
# Create window (Alt + c) or prompt for name (Prefix + c)
bind -n M-w new-window

# Switch windows using Alt + Shift + h/l (or Alt + Left/Right)
bind -n M-H previous-window
bind -n M-L next-window

# Quick swap active window position left or right (Alt + Shift + J/K)
bind -n M-J swap-window -t -1\; select-window -t -1
bind -n M-K swap-window -t +1\; select-window -t +1

# Jump directly to windows using Alt + [Number]
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Session Management
unbind S
bind S command-prompt 'rename-session %%'
# Ctrl-C prompt for new session, Ctrl-N list sessions
bind C-c display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-n display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# -----------------------------
# Popups
# -----------------------------

bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind C-f display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"

# ------------------------------
# Status bar
# ------------------------------
# ------------------------------
# Status bar configuration
# ------------------------------
set -g @bg "#1e1e2e"

set-option -g status "on"
set -g status-position top
set -g status-interval 5

# Length of tmux status line
set -g status-left-length 60
set -g status-right-length 60

# Default statusbar colors (Catppuccin Mocha Base)
set-option -g status-style "bg=#1e1e2e fg=#cdd6f4"

# Default window title colors (Explicitly set to #1e1e2e background)
set-window-option -g window-status-style "bg=#1e1e2e fg=#6c7086"
set-window-option -g window-status-current-style "bg=#1e1e2e fg=#a6e3a1"
set-window-option -g window-status-activity-style "bg=#1e1e2e fg=#f9e2af"
set-window-option -g window-status-bell-style "bg=#f38ba8 fg=#1e1e2e"

# Set pane border lines style
set -g pane-border-lines heavy
set-option -g pane-active-border-style "fg=#94e2d5"
set-option -g pane-border-style "fg=#313245"

# Message info
set-option -g message-style "bg=#74c7ec fg=black"
set-option -g message-command-style "bg=white fg=black"

# Pane number display & Clock
set-option -g display-panes-active-colour "white"
set-option -g display-panes-colour "#1e1e2e"
set-window-option -g clock-mode-colour "#89dceb"

# ------------------------------
# Status Formats
# ------------------------------

# 1. Center the window list
set-option -g status-justify centre

# 2. Left status: Session name + Working directory
set-option -g status-left "\
#[fg=#89b4fa bg=#1e1e2e bold] #S \
#[fg=#6c7086 bg=#1e1e2e]│ \
#[fg=#cba6f7 bg=#1e1e2e bold]󰉋 #{b:pane_current_path}"

# 3. Centered active window (Orange on prefix, Green normal)
set-window-option -g window-status-current-format "\
#{?client_prefix,#[fg=#fab387 bg=#1e1e2e bold] ● #I #W,#[fg=#a6e3a1 bg=#1e1e2e bold] ● #I #W}"

# 4. Centered inactive windows
set-window-option -g window-status-format "\
#[fg=#6c7086 bg=#1e1e2e] ○ #I #W"

# 5. Right status: Conditional SSH indicator + Time
set-option -g status-right "\
#{?SSH_CLIENT,#[fg=#f38ba8 bg=#1e1e2e bold]󰌘 SSH #[fg=#6c7086 bg=#1e1e2e]│ ,}\
#[fg=#89b4fa bg=#1e1e2e bold]󰥔 %l:%M %P"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
